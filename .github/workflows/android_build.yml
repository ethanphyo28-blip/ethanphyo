name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev libtool autoconf automake pkg-config libtool-bin
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          
          # Android API levels ညှိနှိုင်းခြင်း
          sed -i 's/^android.minapi = 21/android.minapi = 24/' buildozer.spec
          
          # အရေးကြီးသည်- build environment ကို clean အရင်လုပ်ပါမယ်
          buildozer android clean
          
          # Build process စတင်ပါ
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # v3 အစား v4 ကို သုံးထားပါတယ်
        with:
          name: python-apk-output
          path: bin/*.apk